server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 20m;   # outbreak-report image uploads

  # Docker's internal DNS. Together with the variables below, nginx re-resolves
  # container addresses on every request, so rebuilding or restarting a service
  # never leaves nginx pointing at an old address (that caused 502 errors).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_up    http://backend:5000;
  set $blockchain_up http://blockchain_backend:7000;
  set $ai_up         http://ai_backend:8000;

  # The browser talks to this one origin; nginx forwards to the right container.
  # "Origin" is rewritten to an allowed value so the backend's CORS check passes
  # no matter which public URL (tunnel, LAN IP, domain) people open the site on.

  # Main backend (REST)
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend_up;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin http://localhost:5173;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebRTC signalling (Socket.IO, websocket upgrade)
  location /socket.io/ {
    proxy_pass $backend_up;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin http://localhost:5173;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }

  # Blockchain backend (payments, donations, outbreak reports, image uploads)
  location /chain/ {
    rewrite ^/chain/(.*)$ /$1 break;
    proxy_pass $blockchain_up;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # AI assistant (FastAPI)
  location /ai/ {
    rewrite ^/ai/(.*)$ /$1 break;
    proxy_pass $ai_up;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  # React Router: always fall back to index.html
  location / {
    try_files $uri /index.html;
  }

  location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri /index.html;
  }
}