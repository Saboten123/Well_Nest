<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="src/assets/health.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WellNest - Your Safe Space for Health & Healing</title>
  <script>
    // Apply the saved/preferred theme before React mounts so there's no
    // flash of the wrong theme on load.
    (function () {
      try {
        var saved = localStorage.getItem('wellnest-theme');
        var theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
